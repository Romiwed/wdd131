<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Explore famous landmarks, museums, parks, and neighborhoods in Milan, Italy."
    >

    <meta
        name="author"
        content="Romina De Santis Cruz"
    >

    <title>Milan Explorer | Attractions</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="styles/hometown.css"
    >

    <script
        src="scripts/hometown.js"
        defer
    ></script>

</head>

<body>

<header class="site-header">

    <a
        class="brand"
        href="index.html"
    >

        <img
            src="images/hometown-explorer-logo.png"
            alt="Milan Explorer Logo"
            width="80"
            height="80"
        >

        <span>Milan Explorer</span>

    </a>

    <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Open Navigation"
        aria-expanded="false"
        aria-controls="main-navigation"
    >
        ☰
    </button>

    <nav
        id="main-navigation"
        class="main-navigation"
        aria-label="Main navigation"
    >

        <a href="index.html">
            Home
        </a>

        <a
            class="active"
            href="attractions.html"
            aria-current="page"
        >
            Attractions
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>

</header>

<main class="page-main">

    <section class="page-intro">

        <h1>Milan Attractions</h1>

        <p>
            Discover famous landmarks, museums, parks, and neighborhoods.
            You can also save your favorite places.
        </p>

    </section>

    <section
        class="content-section"
        aria-labelledby="attractions-heading"
    >

        <h2 id="attractions-heading">
            Explore Attractions
        </h2>

        <div class="filter-controls">

            <label for="category-filter">
                Filter by category
            </label>

            <select
                id="category-filter"
                name="category"
            >

                <option value="all">
                    All Attractions
                </option>

                <option value="landmark">
                    Landmarks
                </option>

                <option value="museum">
                    Museums
                </option>

                <option value="park">
                    Parks
                </option>

                <option value="district">
                    Neighborhoods
                </option>

            </select>

        </div>

        <p
            id="results-message"
            aria-live="polite"
        ></p>

        <div
            id="attractions-container"
            class="card-grid"
        ></div>

    </section>

    <section
        class="content-section"
        aria-labelledby="favorites-heading"
    >

        <h2 id="favorites-heading">
            Saved Favorites
        </h2>

        <div
            id="favorites-container"
            aria-live="polite"
        ></div>

        <button
            id="clear-favorites"
            class="button danger-button"
            type="button"
            aria-label="Clear all saved favorites"
        >
            Clear Favorites
        </button>

    </section>

</main>

<footer class="site-footer">

    <p>
        &copy;
        <span id="current-year"></span>
        Milan Explorer
    </p>

    <p>

        <a href="references.html">
            References
        </a>

    </p>

    <p id="last-modified"></p>

</footer>

</body>

</html>
